<div class="main-container">
  <div class="main-slider-wrapper">
    <app-vertical-slider
      [value]="mainValue"
      [min]="-90"
      [max]="10"
      [step]="0.5"
      [label]="'MAIN'"
      [sublabel]="'Master'"
      [showMuteButton]="false"
      (valueChange)="onValueChange($event)">
    </app-vertical-slider>
  </div>
</div>
