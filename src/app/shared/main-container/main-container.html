<div class="main-container">
  <div class="main-slider-wrapper">
    <app-vertical-slider
      [value]="fader.value"
      [min]="-90"
      [max]="10"
      [step]="0.1"
      [label]="'MAIN'"
      [sublabel]="'Master'"
      [showMuteButton]="true"
      [muted]="fader.switch"
      (valueChange)="onValueChange($event)"
      (muteChange)="onSwitchChange($event)">
    </app-vertical-slider>
  </div>
</div>
