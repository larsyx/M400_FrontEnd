@if(sceneId !== null){
  <div class="user-home-page">
    <!-- Header with tabs and controls -->
    <div class="header-controls">
      <!-- Top row: MAIN and AUX controls (mobile only) -->
      <div class="top-controls">
        <!-- Toggle Main Container button -->
        <button
          type="button"
          class="control-button toggle-main icon-only"
          [class.active]="showMainContainer"
          (click)="toggleMainContainer()"
          title="Toggle Main Container"
          aria-label="Toggle Main Container">
          <i class="bi bi-sliders"></i>
        </button>
        
        <!-- AUX selector -->
        <app-custom-select
          class="aux-select"
          [options]="auxOptions"
          [value]="selectedAux"
          [ariaLabel]="'Select AUX output'"
          [placeholder]="'Select AUX'"
          (valueChange)="onAuxChange($event)">
        </app-custom-select>
      </div>
      
      <!-- Main row: Tabs and controls -->
      <div class="main-row">
        <!-- Tabs for filtering -->
        <div class="tabs-container">
          @for (tab of tabs; track tab.id) {
            <button
              class="tab-button"
              [class.active]="activeTab === tab.id"
              (click)="selectTab(tab.id)">
              <span class="tab-icon">{{ tab.icon }}</span>
              <span class="tab-label">{{ tab.label }}</span>
            </button>
          }
        </div>
        
        <!-- Right controls (desktop only) -->
        <div class="right-controls">
          <!-- Toggle Main Container button -->
          <button
            type="button"
            class="control-button toggle-main icon-only"
            [class.active]="showMainContainer"
            (click)="toggleMainContainer()"
            title="Toggle Main Container"
            aria-label="Toggle Main Container">
            <i class="bi bi-sliders"></i>
          </button>
          
          <!-- AUX selector -->
          <app-custom-select
            class="aux-select"
            [options]="auxOptions"
            [value]="selectedAux"
            [ariaLabel]="'Select AUX output'"
            [placeholder]="'Select AUX'"
            (valueChange)="onAuxChange($event)">
          </app-custom-select>
        </div>
      </div>
    </div>
    
    <!-- Main content area with sliders and optional main container -->
    <div class="main-content" [class.horizontal-layout]="sliderOrientation() === 'horizontal'">
      <div class="sliders-wrapper">
        <app-sliders-container
          [channels]="channelsSelected" 
          (faderChange)="updateFader($event)">
        </app-sliders-container>
      </div>
      
      @if (showMainContainer) {
        <app-main-container [fader]="mainFader" (faderChange)="updateFader($event)"></app-main-container>
      }
    </div>
  </div>
}
@else {
  <div class="d-flex h-100 justify-content-center">
    <div class="empty-state">
      <i class="bi bi-sliders"></i>
      <p>Nessuna scena selezionata</p>
    </div>
  </div>
}
