<div class="home-page">

  <div class="bottom-menu">
    <div class="button-group left-group">
      <!--<button class="btn btn-outline-primary" [class.active]="activeView === HomeViewButtons.EQ" (click)="setView(HomeViewButtons.EQ)">
        EQ
      </button> -->
      <button class="btn btn-outline-primary" [class.active]="activeView === HomeViewButtons.DCA" (click)="setView(HomeViewButtons.DCA)">
        DCA
      </button>
    </div>
    
    <div class="button-group right-group">
      <button class="btn btn-outline-primary"
              [class.active]="sidePanelMode === 'main'"
              (click)="setSidePanelMode('main')">
        MAIN
      </button>
      <button class="btn btn-outline-primary aux-button"
              [class.active]="sidePanelMode === 'aux'"
              (click)="setSidePanelMode('aux')">
        <span class="aux-label">AUX</span>
        <span class="aux-name">{{ selectedAuxName }}</span>
      </button>
    </div>
  </div>

  <div class="content-section"
       [class.has-content]="activeView !== null"
       [class.eq-active]="activeView === HomeViewButtons.EQ"
       [class.dca-active]="activeView === HomeViewButtons.DCA">
    <div class="eq-container" [class.hidden]="activeView !== HomeViewButtons.EQ">
      <app-equalizer></app-equalizer>
    </div>
    
    @if (activeView === HomeViewButtons.DCA) {
      <div class="dca-container">
        <app-dca [dca]="dcaList"></app-dca>
      </div>
    }

    <div class="main-fader">
      <app-sliders-container [channels]="faderSelectedList" (faderChange)="updateFader($event)"></app-sliders-container>
      
      @if (sidePanelMode === 'aux') {
      <app-aux-container 
        [auxs]="auxList"
        (selectionChange)="onAuxSelectionChange($event)">
      </app-aux-container>
      }

      @if (sidePanelMode === 'main') {
      <app-main-container [fader]="mainFader" (faderChange)="updateFader($event)"></app-main-container>
      }
    </div>
  </div>

</div>
