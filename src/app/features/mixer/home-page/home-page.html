<div class="home-page">

  <div class="bottom-menu">
    <button class="btn btn-outline-primary" [class.active]="activeView === HomeViewButtons.EQ" (click)="setView(HomeViewButtons.EQ)">
      EQ
    </button>
    <button class="btn btn-outline-primary" [class.active]="activeView === HomeViewButtons.DCA" (click)="setView(HomeViewButtons.DCA)">
      DCA
    </button>
  </div>

  @if (activeView === HomeViewButtons.EQ) {
    <div class="equalizer-section">
      <app-equalizer></app-equalizer>
    </div>
  }

  @if (activeView === HomeViewButtons.DCA) {
    <div class="equalizer-section">
      <app-dca></app-dca>
    </div>
  }

  <div class="main-fader" [class.with-eq]="isEqActive">
    <app-sliders-container></app-sliders-container>
    <app-aux-container></app-aux-container>
  </div>

</div>
