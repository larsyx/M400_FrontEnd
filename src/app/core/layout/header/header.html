<!-- Desktop Navigation -->
<nav class="navbar navbar-dark bg-primary desktop-nav">
  <div class="container-fluid">
    @if (currentUser) {
      <ul class="navbar-nav d-flex flex-row w-100 justify-content-between align-items-center">
        @for (item of menuItems; track $index) {
          <li class="nav-item">
            <a class="nav-link px-3"
               [routerLink]="item.route"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{exact: item.route === '/'}">
              @if (item.icon) {
                <i class="bi bi-{{ item.icon }} me-2"></i>
              }
              {{ item.label }}
            </a>
          </li>
        }
        
        <li class="nav-item ms-auto">
          <div class="d-flex align-items-center">
            <span class="navbar-text me-3 text-white">
              {{ currentUser.username }}
            </span>
            <button class="btn btn-outline-light btn-sm" (click)="logout()">
              <i class="bi bi-box-arrow-right"></i> Logout
            </button>
          </div>
        </li>
      </ul>
    }
  </div>
</nav>

<!-- Mobile Bottom Navigation -->
<nav class="mobile-nav bg-primary">
  @if (currentUser) {
    <div class="mobile-nav-container">
      @for (item of menuItems; track $index) {
        <a class="mobile-nav-item"
           [routerLink]="item.route"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: item.route === '/'}">
          @if (item.icon) {
            <i class="bi bi-{{ item.icon }}"></i>
          } @else {
            <i class="bi bi-circle"></i>
          }
          <span class="mobile-nav-label">{{ item.label }}</span>
        </a>
      }
      
      <a class="mobile-nav-item" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span class="mobile-nav-label">Logout</span>
      </a>
    </div>
  }
</nav>
